name: weekly-discovery

# 由外部定时器（Cron-job.org）触发，替代 GitHub schedule（该仓库 schedule 不生效）
on:
  workflow_dispatch:

concurrency:
  group: weekly-discovery
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TRANS: /opt/translate-shell/translate

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ghresearcher
        run: pip install --quiet ghresearcher

      - name: Install translate-shell
        run: |
          git clone --quiet --depth 1 https://github.com/soimort/translate-shell /opt/translate-shell
          # translate-shell 已重构：入口从 trans 改为 translate（awk 模块化），依赖 gawk
          if ! command -v gawk >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gawk
          fi
          chmod +x /opt/translate-shell/translate

      - name: Generate weekly CSVs for IDR/Protein Struct/Protein-DNA topic (with Chinese translation)
        run: |
          set -euo pipefail
          since=">=$(date -d '7 days ago' +%Y-%m-%d)"
          ym="$(date +%Y/%m)"
          mkdir -p "discovery/weekly/$ym"
          # idr protein_struct_ai protein_dna
          for t in idr; do
            python3 scripts/weekly_report.py "$t" "discovery/queries/search_${t}_repos.yaml" \
              "discovery/weekly/$ym/${t}_$(date +%F).csv" \
              --updated "$since" --workers 4 --tz Asia/Shanghai
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "weekly discovery update $(date +%F)"
            git pull --rebase
            git push
          fi
