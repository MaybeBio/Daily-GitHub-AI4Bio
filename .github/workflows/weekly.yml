name: weekly-discovery

# 由外部定时器（Cron-job.org）触发，替代 GitHub schedule（该仓库 schedule 不生效）
on:
  workflow_dispatch:

concurrency:
  group: weekly-discovery
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # scripts/trans 为 vendored 的自包含 translate-shell（源：git.io/trans，MIT）
  TRANS: ${{ github.workspace }}/scripts/trans

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        # v7 原生 node24，消除 Node 20 弃用警告
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ghresearcher
        run: pip install --quiet ghresearcher

      - name: Prepare translate-shell (vendored trans, needs gawk)
        run: |
          # trans 已 vendored 到 scripts/trans, 不再 clone 上游（避免上游变动导致 CI 挂）
          # 自包含版仍硬依赖 gawk 解释器 (trans 内部用 gawk -f 运行整套 awk 程序)
          # git clone --quiet --depth 1 https://github.com/soimort/translate-shell /opt/translate-shell
          # chmod +x /opt/translate-shell/translate
          
          chmod +x scripts/trans
          if ! command -v gawk >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gawk
          fi

      - name: Generate weekly CSVs for IDR/Protein Struct/Protein-DNA topic (with Chinese translation)
        run: |
          set -euo pipefail
          since=">=$(date -d '7 days ago' +%Y-%m-%d)"
          ym="$(date +%Y/%m)"
          mkdir -p "discovery/weekly/$ym"
          for t in idr protein_struct_ai protein_dna; do
            # 单个 topic 容错：失败只警告，不中断其他 topic（成功的 CSV 照常提交）
            python3 scripts/weekly_report.py "$t" "discovery/queries/search_${t}_repos.yaml" \
              "discovery/weekly/$ym/${t}_$(date +%F).csv" \
              --updated "$since" --workers 4 --tz Asia/Shanghai \
              || echo "::warning::${t} failed, continuing with other topics"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "weekly discovery update $(date +%F)"
            git pull --rebase
            git push
          fi
