name: daily-follow

on:
  schedule:
    # 00:10 UTC = 08:10 北京时间，每天早上 8 点 10 分处理
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-follow
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ghresearcher
        run: pip install ghresearcher==0.1.0

      - name: Collect activity logs
        run: |
          Y="$(date +%Y)"; M="$(date +%m)"
          SINCE="$(date -d '1 day ago' +%Y-%m-%d)"
          mkdir -p "monitor/users/$Y/$M" "monitor/orgs/$Y/$M" "monitor/received/$Y/$M"

          # 关注用户的动态
          ghresearcher monitor -f monitor/lists/users.txt --since "$SINCE" --expand-commits \
            > "monitor/users/$Y/$M/$(date +%d).txt" || true

          # 关注组织 / 实验室的动态
          ghresearcher monitor -f monitor/lists/orgs.txt --since "$SINCE" --org --expand-commits \
            > "monitor/orgs/$Y/$M/$(date +%d).txt" || true

          # 关注用户的信息流
          ghresearcher monitor -f monitor/lists/users_core.txt --since "$SINCE" -r --expand-commits -l 30 \
            > "monitor/received/$Y/$M/$(date +%d).txt" || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "daily follow update $(date +%F)"
            git pull --rebase
            git push
          fi
